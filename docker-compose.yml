version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16 # Dùng PostgreSQL 16 + pgvector
    container_name: mindvault_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrongPassword123!
      POSTGRES_DB: MindVaultDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # Có thể thêm Redis để làm cache và Hangfire storage
  redis:
    image: redis:7-alpine
    container_name: mindvault_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata: